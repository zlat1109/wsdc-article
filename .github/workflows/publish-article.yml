name: Publish Article Teaser

on:
  workflow_dispatch:
    inputs:
      article_file:
        description: 'Path to the article Markdown file (source for teaser)'
        required: true
        default: 'article_draft.md'
      telegram_chat_id:
        description: 'Target Telegram Chat ID'
        required: true
        default: ''

jobs:
  publish-teaser:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send Telegram Teaser
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 publish_article_bot.py \
            --file "${{ inputs.article_file }}" \
            --chat-id "${{ inputs.telegram_chat_id }}"
